name: Release All-Platform Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ios_only:
        description: 'Run only the unsigned iOS build (skip desktop and Android)'
        type: boolean
        default: false

jobs:
  build-desktop:
    if: ${{ !inputs.ios_only }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            target: ''
            args: ''
          - platform: 'windows-latest'
            target: ''
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'VoiceTavern ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download VoiceTavern for your platform.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  build-android:
    if: ${{ !inputs.ios_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Rust & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125"

      - name: Install npm dependencies
        run: npm ci

      - name: Build Android APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          npx tauri android init --skip-targets-install || true
          npx tauri android build --apk

      - name: Upload Android APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk

  build-ios-unsigned:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install Rust & iOS Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      # tauri ios init shells out to xcodegen; neither macos-latest nor macos-26
      # ships it, and the old `|| true` is what hid that failure.
      - name: Install xcodegen
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Install npm dependencies
        run: npm ci

      - name: Init iOS Project
        run: |
          set -euo pipefail
          npx tauri ios init --ci --skip-targets-install
          echo '--- src-tauri/gen/apple ---'
          ls -la src-tauri/gen/apple
          [ -n "$(find src-tauri/gen/apple -maxdepth 1 -name '*.xcodeproj' -print -quit)" ] \
            || { echo '::error::tauri ios init produced no .xcodeproj'; exit 1; }

      # A bare `xcodebuild archive` cannot drive this project: Tauri's Xcode
      # script phase connects back to the CLI's options server via
      # $TMPDIR/<identifier>-server-addr, so raw xcodebuild panics with
      # "failed to read missing addr file". `tauri ios build` is the supported
      # device path: it starts that server, builds the `release` configuration
      # (the generated project's configs are lowercase debug/release), and
      # --no-sign archives with code signing disabled.
      - name: Build Unsigned iOS App
        run: |
          set -euo pipefail
          npm run build
          npx tauri ios build --no-sign
          find src-tauri/gen/apple/build -maxdepth 1 -name '*.xcarchive' -print

      - name: Package Unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p build
          APP="$(find src-tauri/gen/apple/build build -maxdepth 5 -type d -name '*.app' -path '*/Products/Applications/*' -print -quit)"
          [ -n "$APP" ] || { echo '::error::archive produced no .app'; find src-tauri/gen/apple/build build -maxdepth 4 \( -name '*.xcarchive' -o -name '*.app' \); exit 1; }
          echo "app=$APP"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          [ -n "$(find build/Payload -maxdepth 1 -name '*.app' -print -quit)" ] \
            || { echo '::error::refusing to package an empty Payload'; exit 1; }
          rm -rf build/Payload/*.app/_CodeSignature
          rm -f build/Payload/*.app/embedded.mobileprovision
          ( cd build && zip -qry ../VoiceTavern_unsigned.ipa Payload )
          shasum -a 256 VoiceTavern_unsigned.ipa | tee VoiceTavern_unsigned.ipa.sha256
          ls -l VoiceTavern_unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: VoiceTavern-unsigned-ipa
          path: |
            VoiceTavern_unsigned.ipa
            VoiceTavern_unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload iOS IPA
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            VoiceTavern_unsigned.ipa
            VoiceTavern_unsigned.ipa.sha256
