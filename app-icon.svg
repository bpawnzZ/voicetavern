<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2dd4bf" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="12 8" />

  <!-- Center Circle -->
  <circle cx="256" cy="256" r="140" fill="#0f172a" stroke="url(#micGrad)" stroke-width="6" filter="url(#shadow)" />

  <!-- Voice Tavern 'V' Symbol -->
  <path d="M 196 186 L 256 316 L 316 186" fill="none" stroke="url(#micGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Sound Waves -->
  <path d="M 156 226 C 146 242 146 270 156 286" fill="none" stroke="#2dd4bf" stroke-width="10" stroke-linecap="round" />
  <path d="M 356 226 C 366 242 366 270 356 286" fill="none" stroke="#2dd4bf" stroke-width="10" stroke-linecap="round" />
  <path d="M 126 206 C 106 236 106 276 126 306" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" opacity="0.6" />
  <path d="M 386 206 C 406 236 406 276 386 306" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" opacity="0.6" />
</svg>
